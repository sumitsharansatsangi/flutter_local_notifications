name: flutter_local_notifications_web
description: Web implementation of the flutter_local_notifications plugin
version: 2.0.0-dev.1
homepage: https://github.com/MaikuB/flutter_local_notifications/tree/master/flutter_local_notifications_web
issue_tracker: https://github.com/MaikuB/flutter_local_notifications/issues
publish_to: none # Remove this line if you wish to publish to pub.dev

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  collection: ^1.19.1
  flutter:
    sdk: flutter
  flutter_local_notifications_platform_interface:
    git: https://github.com/kumsumit/flutter_local_notifications_platform_interface.git
  timezone: ^0.11.1
  web: ^1.1.1

dev_dependencies:
  build_runner: ^2.16.1
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      web:
        pluginClass: WebFlutterLocalNotificationsPlugin
        fileName: "flutter_local_notifications_web.dart"

  assets:
    - web/notifications_service_worker.js
